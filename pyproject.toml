[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrl-f-for-video"
version = "0.1.0"
description = "Semantic search over video frames on Runpod Serverless, built with Flash"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["runpod-flash", "numpy", "python-dotenv"]
